# Cathedral of the Hollow Saint: a haunted hurdy-gurdy. Not in the workshop bundle: point --plugin-dir at its
# source and put its presets in hollow_saint-presets/ next to this scene (both are in
# https://github.com/SammiBabe666/Project_Hollow_Saint):
#
#   git clone https://github.com/SammiBabe666/Project_Hollow_Saint ~/dev/hollow_saint
#   cp -r "~/dev/hollow_saint/release/presets/synth/hollow saint" examples/hollow_saint-presets
#   ./op1video.py --plugin-dir ~/dev/hollow_saint/plugin/hollow_saint render hollow_saint \
#       --scene examples/hollow_saint-presets.yaml
#
plugin: hollow_saint
title: HOLLOW SAINT
subtitle: a haunted hurdy-gurdy
duration: 26
fps: 30
bpm: 100
labels: [Drone, Strings, Wheel buzz, Cathedral]
labels2: [Key, Relic age, Rate]
master: 50

presets:
  - {at: 0.0,  file: hollow_saint-presets/hollow saint.aif,   text: "follow drone, 1/8 wheel strokes"}
  - {at: 6.5,  file: hollow_saint-presets/plague dance.aif,   text: "bright folk dance, 1/8T buzz", glide: 0.6}
  - {at: 13.0, file: hollow_saint-presets/drowned bell.aif,   text: "cathedral at full, drone on A", glide: 0.6}
  - {at: 19.5, file: hollow_saint-presets/midnight vigil.aif, text: "Lo-Fi Relic on: a worn cassette", glide: 0.6}

notes:
  - {at: 0.2,  every: 0.3, len: 0.27, notes: "D4 E4 F4 G4 A4 - A4 G4 F4 E4 D4 - - E4 F4 D4 - -", until: 6.2, vel: 110}
  - {at: 6.6,  every: 0.2, len: 0.17, notes: "A4 A4 G4 A4 C5 A4 G4 E4 G4 G4 F4 G4 A4 G4 E4 D4 E4 E4 D4 E4 F4 E4 D4 C4 D4 - D4 -", until: 12.6, vel: 118}
  - {at: 13.2, len: 2.8, note: E4, vel: 100}
  - {at: 16.2, len: 3.0, note: C4, vel: 100}
  - {at: 19.7, len: 2.6, note: D4, vel: 100}
  - {at: 22.4, len: 3.2, note: F4, vel: 100}

moves:
  - {at: 2.0,  to: 5.5,  knob: orange, value: 85}   # CATHEDRAL
  - {at: 8.0,  to: 12.0, knob: white,  value: 90}   # WHEEL BUZZ
  - {at: 14.0, to: 18.5, knob: green,  value: 90}   # STRINGS
  - {at: 20.0, press: green}                        # push green: Lo-Fi Relic on
  - {at: 20.5, to: 24.5, knob: green2, value: 90}   # relic age
