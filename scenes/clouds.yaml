# Clouds: granular textures after Mutable Instruments Clouds. Freeze with an orange push, then scrub with blue.
plugin: clouds
title: CLOUDS
subtitle: Granular textures, after Mutable Instruments Clouds.
duration: 13
labels: [Position, Size, Density, Texture]
source: {type: pluck, level: 75}
envelope: {attack: 2, decay: 300, sustain: 40, release: 300}
notes:
  - {at: 0.1, every: 0.3, len: 0.25, notes: "G3 D4 B3 A3 E4 C4", until: 8.0}
moves:
  - {at: 1.0, to: 3.0, knob: white, value: 80}
  - {at: 3.0, to: 5.0, knob: green, value: 70}
  - {at: 6.0, press: orange}                       # freeze
  - {at: 6.5, to: 11.5, knob: blue, value: 90, ease: sine}
  - {at: 12.0, press: orange}
